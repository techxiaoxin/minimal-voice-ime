plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'icu.astronot233.rime'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        minSdk 26
        ndk {
            abiFilters 'arm64-v8a'
        }
        // 临时禁用 native 编译：/tmp/boost 头文件残缺导致 CMake 失败，本轮复用预置 librime-jni.so。
        // 恢复 boost 头文件后，取消下面注释即可重新编译 rime native。
        // externalNativeBuild {
        //     cmake {
        //         arguments '-DCMAKE_CXX_STANDARD=17',
        //                 '-DCMAKE_CXX_STANDARD_REQUIRED=ON',
        //                 '-DCMAKE_BUILD_TYPE=Release'
        //         cppFlags '-Wno-deprecated', '-fpermissive', '-fno-char8_t'
        //     }
        // }
    }

    buildTypes {
        release {
            minifyEnabled false
            consumerProguardFiles 'consumer-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // 临时禁用 CMake 入口，so 由 app/src/main/jniLibs 预置提供。boost 修复后取消注释。
    // externalNativeBuild {
    //     cmake {
    //         path file('src/main/jni/CMakeLists.txt')
    //     }
    // }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.20'
    implementation 'androidx.annotation:annotation:1.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
