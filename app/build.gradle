plugins {
    id 'com.android.application'
}

android {
    namespace 'com.minivoice.ime'
    compileSdk 34

    defaultConfig {
        applicationId "com.minivoice.ime"
        minSdk 26
        targetSdk 34
        versionCode 49
        versionName "0.2.19"
        ndk {
            abiFilters "arm64-v8a"
        }
        // 内置 Key 不再写死在源码里，从本机的 local.properties 读，那个文件不进仓库。
        // 仓库里默认是空串，用户装完自己去设置页填自己的 Key。
        buildConfigField "String", "DEFAULT_BAILIAN_KEY", "\"${bailianKey()}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
}

/**
 * 从 local.properties 读内置 Key。
 * 这个文件里有 sdk.dir 和 Key，永远不进仓库，别人 clone 下来读到的是空串，
 * 装完自己去设置页填自己的 Key 就能用。
 */
String bailianKey() {
    def props = new Properties()
    def f = rootProject.file("local.properties")
    if (f.exists()) {
        f.withInputStream { props.load(it) }
    }
    return props.getProperty("bailian.key", "")
}
